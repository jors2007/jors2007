<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Pac-Man comiéndose a los fantasmas">
  <defs>
    <clipPath id="dotsClip">
      <rect x="-40" y="0" width="1000" height="110">
        <animate attributeName="x" from="-40" to="940" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <path id="ghost" d="M-16 16 V-2 A16 16 0 0 1 16 -2 V16 L10.5 11 L5.3 16 L0 11 L-5.3 16 L-10.5 11 Z"/>
  </defs>

  <rect x="1" y="1" width="898" height="108" rx="14" fill="#0d1b2a" stroke="#0b5a85" stroke-width="2"/>

  <!-- Puntos que va comiendo -->
  <g clip-path="url(#dotsClip)" fill="#cfe9ff">
    <circle cx="40" cy="55" r="3"/><circle cx="80" cy="55" r="3"/><circle cx="120" cy="55" r="3"/>
    <circle cx="190" cy="55" r="3"/><circle cx="230" cy="55" r="3"/><circle cx="270" cy="55" r="3"/>
    <circle cx="340" cy="55" r="3"/><circle cx="380" cy="55" r="3"/><circle cx="420" cy="55" r="3"/>
    <circle cx="490" cy="55" r="3"/><circle cx="530" cy="55" r="3"/><circle cx="570" cy="55" r="3"/>
    <circle cx="640" cy="55" r="3"/><circle cx="680" cy="55" r="3"/><circle cx="720" cy="55" r="3"/>
    <circle cx="790" cy="55" r="3"/><circle cx="830" cy="55" r="3"/><circle cx="870" cy="55" r="3"/>
  </g>

  <!-- Fantasmas asustados (desaparecen cuando Pac-Man llega) -->
  <g transform="translate(150 55)">
    <g><use href="#ghost" fill="#2a4bd7"/><circle cx="-5" cy="-4" r="2.6" fill="#fff"/><circle cx="5" cy="-4" r="2.6" fill="#fff"/><path d="M-9 6 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#fff" stroke-width="1.5"/>
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.184;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <g transform="translate(300 55)">
    <g><use href="#ghost" fill="#2a4bd7"/><circle cx="-5" cy="-4" r="2.6" fill="#fff"/><circle cx="5" cy="-4" r="2.6" fill="#fff"/><path d="M-9 6 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#fff" stroke-width="1.5"/>
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.337;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <g transform="translate(450 55)">
    <g><use href="#ghost" fill="#2a4bd7"/><circle cx="-5" cy="-4" r="2.6" fill="#fff"/><circle cx="5" cy="-4" r="2.6" fill="#fff"/><path d="M-9 6 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#fff" stroke-width="1.5"/>
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.490;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <g transform="translate(600 55)">
    <g><use href="#ghost" fill="#2a4bd7"/><circle cx="-5" cy="-4" r="2.6" fill="#fff"/><circle cx="5" cy="-4" r="2.6" fill="#fff"/><path d="M-9 6 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#fff" stroke-width="1.5"/>
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.643;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <g transform="translate(750 55)">
    <g><use href="#ghost" fill="#2a4bd7"/><circle cx="-5" cy="-4" r="2.6" fill="#fff"/><circle cx="5" cy="-4" r="2.6" fill="#fff"/><path d="M-9 6 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#fff" stroke-width="1.5"/>
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.796;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g>
  </g>

  <!-- Puntaje que aparece al comer cada fantasma -->
  <g font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#7fd0ff" text-anchor="middle">
    <text x="150" y="30" opacity="0">200<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.184;0.244;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="300" y="30" opacity="0">200<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.337;0.397;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="450" y="30" opacity="0">200<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.490;0.550;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="600" y="30" opacity="0">200<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.643;0.703;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="750" y="30" opacity="0">200<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.796;0.856;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- Pac-Man -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-40 55" to="940 55" dur="8s" repeatCount="indefinite"/>
    <path fill="#ffd900" d="M0 0 L14.7 -10.3 A18 18 0 1 0 14.7 10.3 Z">
      <animate attributeName="d" values="M0 0 L14.7 -10.3 A18 18 0 1 0 14.7 10.3 Z;M0 0 L18 -0.6 A18 18 0 1 0 18 0.6 Z;M0 0 L14.7 -10.3 A18 18 0 1 0 14.7 10.3 Z" dur="0.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="2" cy="-9" r="2.2" fill="#0d1b2a"/>
  </g>
</svg>
