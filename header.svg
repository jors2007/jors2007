<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Jors B-)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5a85">
        <animate attributeName="stop-color" values="#0b5a85;#0e6fa3;#0b5a85" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2b9bd6">
        <animate attributeName="stop-color" values="#2b9bd6;#1f84bd;#2b9bd6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0a2c45" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0a2c45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="230" fill="url(#bg)"/>

  <!-- Enlaces de red con flujo de datos -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
    <line x1="50" y1="40" x2="150" y2="120"/>
    <line x1="150" y1="120" x2="80" y2="185"/>
    <line x1="50" y1="40" x2="230" y2="50"/>
    <line x1="150" y1="120" x2="230" y2="50"/>
    <line x1="150" y1="120" x2="260" y2="175"/>
    <line x1="230" y1="50" x2="300" y2="110"/>
    <line x1="260" y1="175" x2="300" y2="110"/>
    <line x1="300" y1="110" x2="450" y2="20"/>
    <line x1="300" y1="110" x2="450" y2="210"/>
    <line x1="450" y1="20" x2="600" y2="110"/>
    <line x1="450" y1="20" x2="640" y2="40"/>
    <line x1="600" y1="110" x2="640" y2="40"/>
    <line x1="600" y1="110" x2="590" y2="185"/>
    <line x1="600" y1="110" x2="720" y2="150"/>
    <line x1="640" y1="40" x2="800" y2="60"/>
    <line x1="720" y1="150" x2="800" y2="60"/>
    <line x1="720" y1="150" x2="850" y2="175"/>
    <line x1="800" y1="60" x2="850" y2="175"/>
    <line x1="450" y1="210" x2="590" y2="185"/>
    <line x1="450" y1="210" x2="260" y2="175"/>
    <line x1="450" y1="20" x2="230" y2="50"/>
  </g>

  <!-- Paquetes viajando por la red -->
  <g fill="#ffffff">
    <circle r="3.4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M50 40 L150 120"/></circle>
    <circle r="3.4" fill="#bff0ff"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M150 120 L260 175"/></circle>
    <circle r="3.4"><animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M230 50 L300 110"/></circle>
    <circle r="3.4" fill="#bff0ff"><animateMotion dur="3.6s" begin="0.2s" repeatCount="indefinite" path="M300 110 L450 20"/></circle>
    <circle r="3.4"><animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite" path="M450 210 L300 110"/></circle>
    <circle r="3.4" fill="#bff0ff"><animateMotion dur="3.2s" begin="0.6s" repeatCount="indefinite" path="M450 20 L600 110"/></circle>
    <circle r="3.4"><animateMotion dur="2.6s" begin="1.5s" repeatCount="indefinite" path="M600 110 L720 150"/></circle>
    <circle r="3.4" fill="#bff0ff"><animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite" path="M800 60 L640 40"/></circle>
    <circle r="3.4"><animateMotion dur="2.9s" begin="1s" repeatCount="indefinite" path="M720 150 L850 175"/></circle>
    <circle r="3.4" fill="#bff0ff"><animateMotion dur="3.1s" begin="1.8s" repeatCount="indefinite" path="M590 185 L450 210"/></circle>
    <circle r="3.4"><animateMotion dur="2.5s" begin="0.9s" repeatCount="indefinite" path="M800 60 L850 175"/></circle>
    <circle r="3.4" fill="#bff0ff"><animateMotion dur="3.3s" begin="2s" repeatCount="indefinite" path="M260 175 L450 210"/></circle>
  </g>

  <!-- Nodos / routers con pulso -->
  <g fill="#0a3a5a" stroke="#d6f1ff" stroke-width="2">
    <circle cx="50" cy="40" r="7"/>
    <circle cx="150" cy="120" r="9"/>
    <circle cx="80" cy="185" r="7"/>
    <circle cx="230" cy="50" r="8"/>
    <circle cx="260" cy="175" r="8"/>
    <circle cx="300" cy="110" r="10"/>
    <circle cx="450" cy="20" r="9"/>
    <circle cx="450" cy="210" r="9"/>
    <circle cx="600" cy="110" r="10"/>
    <circle cx="640" cy="40" r="8"/>
    <circle cx="590" cy="185" r="7"/>
    <circle cx="720" cy="150" r="9"/>
    <circle cx="800" cy="60" r="8"/>
    <circle cx="850" cy="175" r="7"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1.5">
    <circle cx="300" cy="110" r="10"><animate attributeName="r" values="10;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="110" r="10"><animate attributeName="r" values="10;26" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="120" r="9"><animate attributeName="r" values="9;22" dur="2.8s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="150" r="9"><animate attributeName="r" values="9;22" dur="2.8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="20" r="9"><animate attributeName="r" values="9;22" dur="3s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Halo detrás del texto para legibilidad -->
  <ellipse cx="450" cy="115" rx="190" ry="62" fill="url(#glow)"/>

  <text x="450" y="132" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff" opacity="0">
    Jors B-)
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="1.2s" fill="freeze"/>
  </text>
</svg>
